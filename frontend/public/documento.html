<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Documento — Vagas.Innomaker</title>
<script>(function(){document.documentElement.dataset.tema=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro"})();</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%2341A639%22/></svg>">
<link rel="stylesheet" href="/assets/paginas.css?v=__VERSAO__">
<script src="/assets/tema.js?v=__VERSAO__" defer></script>
<script src="/assets/documento.js?v=__VERSAO__" defer></script>
</head>
<body>
  <div class="barra no-print">
    <a class="botao" id="voltar" href="/">← Voltar</a>
    <div class="dir">
      <button class="botao" type="button" id="imprimir">Imprimir / salvar PDF</button>
    </div>
  </div>

  <p class="carregando" id="carregando">Carregando o documento…</p>

  <article class="folha" id="folha" hidden>
    <div class="topo">INNOMAKER<span id="titulo"></span></div>
    <div class="texto" id="texto"></div>
    <div class="assinatura" id="rodape"></div>
  </article>

  <form id="assinar" class="assinar no-print" hidden>
    <h2>Assinar eletronicamente</h2>
    <p>Leia todo o documento. Para assinar, digite seu nome completo e CPF exatamente como no cadastro.</p>
    <label>Nome completo<input name="nome" required autocomplete="name"></label>
    <label>CPF<input name="cpf" required inputmode="numeric" placeholder="000.000.000-00"></label>
    <label class="check"><input type="checkbox" name="concordo"> Li o documento e concordo com todos os termos.</label>
    <div id="msg" role="alert"></div>
    <button type="submit">Assinar documento</button>
  </form>
</body>
</html>
