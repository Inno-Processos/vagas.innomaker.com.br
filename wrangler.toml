# Cloudflare Worker — vagas.innomaker.com.br
# Tudo roda aqui: site, área do candidato, painel interno, banco (D1), arquivos (R2) e e-mails.
# Primeira configuração: veja o README.

name = "vagas"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  { pattern = "vagas.innomaker.com.br", custom_domain = true }
]

# CSS/JS estáticos (pasta public/ → /assets/...)
[assets]
directory = "./public"

# Templates HTML importados como texto
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Banco de dados (vagas, candidatos, etapas, solicitações, admissões, funcionários, documentos)
# Crie com: npx wrangler d1 create vagas-db  → copie o database_id gerado para cá
[[d1_databases]]
binding = "DB"
database_name = "vagas-db"
database_id = "00000000-0000-0000-0000-000000000000"   # TROQUE pelo ID gerado no "d1 create"
migrations_dir = "migrations"

# Arquivos (currículos e documentos de admissão)
# Crie com: npx wrangler r2 bucket create vagas-arquivos
[[r2_buckets]]
binding = "ARQUIVOS"
bucket_name = "vagas-arquivos"

# Rotina diária às 05:00 UTC (02:00 em Brasília): fecha vagas vencidas e avisa sobre contratos
[triggers]
crons = ["0 5 * * *"]

[observability]
enabled = true

[vars]
SITE_URL = "https://vagas.innomaker.com.br"

# ---------- Authelia (login do painel interno) ----------
AUTHELIA_URL = "https://auth.innomaker.com.br"
AUTHELIA_AUTHZ_PATH = "/api/authz/forward-auth"   # Authelia 4.37 ou anterior: /api/verify
AUTHELIA_COOKIE = "authelia_session"
GRUPOS_RH = "rh"
GRUPOS_GERENTE = "gerente,gerentes,gestor,gestores"
GRUPOS_FUNCIONARIO = "funcionario,funcionarios,colaborador,colaboradores"

# ---------- E-mail (Resend) ----------
EMAIL_FROM = "Innomaker Recrutamento <vagas@innomaker.com.br>"
EMAIL_REPLY_TO = "ainnomaker@gmail.com"

# Troque quando mudar CSS/JS para forçar os navegadores a baixarem a versão nova
VERSAO_ASSETS = "2026-11-04b"

# Segredos (não ficam no repositório) — Configurações → Variáveis e segredos, ou `npx wrangler secret put NOME`:
#   SESSION_SECRET  — chave longa e aleatória para assinar a sessão dos candidatos
#   RESEND_API_KEY  — chave da API do Resend (sem ela, os e-mails ficam só registrados no Histórico)
