services:
  # API e regras de negócio. Não fica exposto: só o frontend fala com ele, pela rede interna.
  backend:
    build: ./backend
    container_name: vagas-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATA_DIR: /data
      API_PORT: 3001
    volumes:
      - ./data:/data
      # Backup FORA do servidor: monte aqui um disco externo, pasta de rede (NAS) ou pasta sincronizada
      # com a nuvem e defina BACKUP_EXTERNO_DIR=/backup-externo no backend/.env. Ex.:
      # - /mnt/nas/vagas-backup:/backup-externo
    # Mesmo DNS do SAC: resolve auth.innomaker.com.br pela rede interna
    dns:
      - 192.168.0.201
      - 1.1.1.1

  # Telas (site, painel, documento). É o que o Traefik publica em vagas.innomaker.com.br.
  frontend:
    build: ./frontend
    container_name: vagas
    restart: unless-stopped
    environment:
      API_URL: http://backend:3001
    depends_on: [backend]
    networks:
      - default
      - proxy
    labels:
      traefik.enable: 'true'
      traefik.docker.network: 'proxy'
      traefik.http.routers.vagas.rule: 'Host(`vagas.innomaker.com.br`)'
      traefik.http.routers.vagas.entrypoints: 'https'
      traefik.http.routers.vagas.tls.certresolver: 'cloudflare'
      traefik.http.services.vagas.loadbalancer.server.port: '3000'

networks:
  proxy:
    external: true
